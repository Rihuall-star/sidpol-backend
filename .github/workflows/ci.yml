name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio para el token del workflow
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas (pytest)
        run: pytest tests -v

      - name: Auditoría de vulnerabilidades (pip-audit)
        run: pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off

  imagen:
    name: Imagen Docker y chequeo de salud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t sidpol:ci .

      - name: Arrancar con MongoDB y comprobar /health
        run: |
          docker network create red-ci
          docker run -d --name mongo --network red-ci mongo:7
          docker run -d --name web --network red-ci -p 8000:8000 \
            -e SECRET_KEY=solo-para-ci -e MONGO_URI=mongodb://mongo:27017/ sidpol:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs web
          exit 1
